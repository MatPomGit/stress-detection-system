[tool.poetry]
name = "stress-detection-backend"
version = "0.1.0"
description = "Backend service for real-time stress detection system"
authors = ["Nuvai Team <dev-team@nuvai.io>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"

# Core dependencies
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"

# Machine Learning
scikit-learn = "^1.3.0"
# tensorflow-lite will be added when needed

# Computer Vision
opencv-python = "^4.8.0"
mediapipe = "^0.10.0"

# Audio Processing
librosa = "^0.10.0"
sounddevice = "^0.4.6"
webrtcvad = "^2.0.10"

# System Monitoring
psutil = "^5.9.0"
pynput = "^1.7.6"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"

# Security/Encryption
cryptography = "^41.0.0"

# Task Scheduling
apscheduler = "^3.10.0"

# Utilities
pyyaml = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.12.0"
black = "^23.12.0"
ruff = "^0.1.9"
mypy = "^1.7.0"
httpx = "^0.25.0"  # For testing FastAPI

[tool.poetry.scripts]
stress-backend = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
